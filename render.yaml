# Render Blueprint — API + Postgres (Singapore). Frontend lives on Vercel.
# Secrets marked `generateValue` are created once by Render and then kept;
# `sync: false` values are entered by you in the dashboard.
databases:
  - name: parvsetu-db
    plan: free            # free Postgres expires after 30 days — upgrade before real use
    region: singapore
    databaseName: parvsetu
    user: parvsetu
    postgresMajorVersion: "16"

services:
  - type: web
    name: parvsetu-api
    runtime: node
    plan: free            # sleeps when idle; use "starter" for festival days
    region: singapore
    rootDir: backend
    buildCommand: npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/v1/public/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: parvsetu-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SIGNING_SECRET    # never rotate after printing QRs — it invalidates them all
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: TRUST_PROXY
        value: "1"
      - key: PAYMENTS_MOCK_ENABLED
        value: "false"
      - key: SEED_DEMO
        value: "false"
      - key: CORS_ORIGINS          # your Vercel URL(s), comma separated; * = one label, e.g. https://parvsetu-*.vercel.app
        sync: false
      - key: BOOTSTRAP_ADMIN_MOBILE
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
