# Render Blueprint — API (Singapore). Frontend lives on Vercel; the database is
# Neon Postgres 16 in Singapore (moved off Render's free Postgres, which expires
# after 30 days). Secrets marked `generateValue` are created once by Render and
# then kept; `sync: false` values are entered by you in the dashboard.

services:
  - type: web
    name: parvsetu-api
    runtime: node
    plan: free            # sleeps when idle; use "starter" for festival days
    region: singapore
    rootDir: backend
    buildCommand: npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/v1/public/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL        # Neon direct (non-pooled) connection string, ending ?sslmode=require
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SIGNING_SECRET    # never rotate after printing QRs — it invalidates them all
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: TRUST_PROXY
        value: "1"
      - key: PAYMENTS_MOCK_ENABLED
        value: "false"
      - key: INSTAGRAM_APP_ID      # Meta app → Instagram → Instagram app ID (see docs/INSTAGRAM.md); empty = Instagram import off
        sync: false
      - key: INSTAGRAM_APP_SECRET  # Instagram app secret — dashboard only, never in the repo
        sync: false
      - key: SEED_DEMO            # "true" (plus DEMO_PASSWORD) loads demo mandals/events/logins; skips itself once they exist
        sync: false
      - key: DEMO_PASSWORD        # password for the demo accounts on this deployment (min 10 chars)
        sync: false
      - key: CORS_ORIGINS          # your Vercel URL(s), comma separated; * = one label, e.g. https://parvsetu-*.vercel.app
        sync: false
      - key: BOOTSTRAP_ADMIN_MOBILE
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
