services:
  postgres:
    image: postgres:16-alpine
    container_name: parvsetu-postgres
    environment:
      POSTGRES_USER: parvsetu
      POSTGRES_PASSWORD: parvsetu
      POSTGRES_DB: parvsetu
    ports:
      - "55440:5432"
    volumes:
      - parvsetu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parvsetu"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  parvsetu-pgdata:
