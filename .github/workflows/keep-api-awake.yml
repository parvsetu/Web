# Render's free plan sleeps the API after ~15 idle minutes; the next visitor
# then waits 15-60 s for it to wake (and the site can time out). Pinging the
# health endpoint every 10 minutes keeps it awake. Remove once the API is on
# a paid Render instance (those never sleep).
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://parvsetu-api.onrender.com/api/v1/public/health) && [ "$code" = "200" ] && { echo "API awake ($code)"; exit 0; }
            echo "attempt $i: $code"; sleep 10
          done
          echo "API did not answer"; exit 1
